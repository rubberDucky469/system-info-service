services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-status-app
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - proxy-net

  nginx:
    image: nginx:1.27-alpine
    container_name: system-status-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge
